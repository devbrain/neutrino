name: Documentation

# Builds the Docusaurus site to check it still compiles. It does NOT publish anywhere.
#
# The site's own build is the test: onBrokenLinks and onBrokenAnchors are both set to 'throw',
# so a dead cross-link or a renamed heading fails here rather than being discovered by a reader.
# That is the whole value of running this in CI -- the docs cross-link heavily, and those links
# are exactly the kind of thing that rots silently.
#
# Publishing is deliberately not automated. Where (and whether) this site is hosted has not been
# decided; when it is, that is a separate change and a deliberate one.

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Read-only. Nothing here writes to the repository or to any deployment target.
permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref -- this only validates, so an older result is
  # never worth waiting for.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile, so a transitive
      # release cannot change what is being validated.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
