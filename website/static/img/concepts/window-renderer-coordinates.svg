<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" role="img" aria-labelledby="title desc">
  <title id="title">One window, three coordinate measurements</title>
  <desc id="desc">An 800 by 600 point window has a 1600 by 1200 pixel drawable at density two. A 640 by 360 logical canvas is presented between letterbox bars that are 75 window points, or 150 drawable pixels, tall. A pointer at window position 200, 200 maps to logical position 160, 100.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="840" height="580" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="32" y="38" font-size="23" font-weight="700">One picture, three measurements</text>
    <text x="32" y="68" font-size="17">Window points → drawable pixels → logical canvas</text>

    <text x="48" y="112" font-size="19" font-weight="700">Window: 800 × 600 points</text>
    <text x="48" y="138" font-size="16">Drawable: 1600 × 1200 pixels (density 2)</text>

    <!-- Window geometry is drawn at 0.5 SVG units per window point. -->
    <rect x="48" y="162" width="400" height="300" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="48" y="199.5" width="400" height="225" fill="#dbeafe"/>
    <path d="M48 255.75H448 M48 312H448 M48 368.25H448 M148 199.5V424.5 M248 199.5V424.5 M348 199.5V424.5" stroke="#93c5fd" stroke-width="1"/>
    <text x="248" y="187" text-anchor="middle" font-size="16" fill="#fff">75 points / 150 pixels</text>
    <text x="248" y="450" text-anchor="middle" font-size="16" fill="#fff">75 points / 150 pixels</text>
    <text x="62" y="223" font-size="16">Canvas origin: window (0, 75)</text>
    <circle cx="148" cy="262" r="7" fill="#1d4ed8" stroke="#fff" stroke-width="2"/>
    <rect x="167" y="244" width="222" height="35" rx="6" fill="#fff"/>
    <text x="179" y="267" font-size="17" font-weight="600">Window click (200, 200)</text>
    <text x="62" y="405" font-size="16">Content: 1600 × 900 drawable pixels</text>

    <text x="510" y="168" font-size="19" font-weight="700">Canvas: 640 × 360 units</text>
    <text x="510" y="194" font-size="16">Draw and hit-test here</text>
    <!-- Logical canvas is drawn at 0.45 SVG units per drawing unit. -->
    <rect x="510" y="230" width="288" height="162" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M510 270.5H798 M510 311H798 M510 351.5H798 M582 230V392 M654 230V392 M726 230V392" stroke="#93c5fd" stroke-width="1"/>
    <text x="521" y="251" font-size="15">(0, 0)</text>
    <circle cx="582" cy="275" r="7" fill="#1d4ed8" stroke="#fff" stroke-width="2"/>
    <rect x="599" y="259" width="102" height="32" rx="6" fill="#fff"/>
    <text x="610" y="281" font-size="16" font-weight="600">(160, 100)</text>
    <text x="786" y="381" text-anchor="end" font-size="15">(640, 360) edge</text>

    <path d="M452 305 C478 305 479 305 503 305" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="510" y="427" font-size="16">Same point, different numbers.</text>
    <text x="510" y="452" font-size="16">Bars lie outside the canvas.</text>

    <rect x="32" y="486" width="776" height="68" rx="8" fill="#e2e8f0"/>
    <text x="48" y="513" font-size="17">Window (200, 200) × 2 → drawable pixels (400, 400)</text>
    <text x="48" y="540" font-size="17">Subtract the bar offset (0, 150), then divide by 2.5 → render position (160, 100)</text>
  </g>
</svg>
